[project]
name = "iris-classification"
version = "0.1.0"
description = "Iris flower classification with Logistic Regression — Practice 2 for Software Development Oriented to ML."
requires-python = ">=3.10,<4.0"

dependencies = [
    "scikit-learn>=1.0,<2.0",
    "pandas>=2.0,<4.0",
    "numpy>=1.24,<3.0",
    "matplotlib>=3.0,<4.0",
    "seaborn>=0.13,<1.0",
    "jupyter>=1.0,<2.0",
    "joblib>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pdoc>=15.0,<16.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
