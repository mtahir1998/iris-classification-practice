name: Publish documentation

# Rebuild the API documentation from the docstrings in src/ and publish it to
# the gh-pages branch on every push to main, so the published site always
# matches the code in this repository.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Never let two publishes race each other onto the gh-pages branch.
concurrency:
  group: publish-documentation
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the project and its development dependencies
        run: uv sync --all-extras

      - name: Build the API documentation with pdoc
        run: uv run pdoc --docformat google --output-dir docs src

      - name: Publish the documentation to the gh-pages branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # .nojekyll stops GitHub Pages running the output through Jekyll,
          # which would otherwise hide files and folders beginning with "_".
          touch docs/.nojekyll
          cd docs
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish documentation built from ${GITHUB_SHA}"
          git push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
